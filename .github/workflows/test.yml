name: Test Traffic Manager
on: [push, pull_request]
permissions:
  contents: read
jobs:
  playtest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install eclipse-sumo==1.28.0 sumo-data==1.28.0
      - run: npm run test:sumo
      - uses: actions/cache@v4
        id: sumo-wasm
        with:
          path: sumo-wasm
          key: sumo-wasm-${{ hashFiles('scripts/build-sumo-wasm.sh') }}
      - name: Build Eclipse SUMO for the browser
        if: steps.sumo-wasm.outputs.cache-hit != 'true'
        run: |
          git clone --quiet --depth 1 --branch 4.0.23 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install 4.0.23
          "$RUNNER_TEMP/emsdk/emsdk" activate 4.0.23
          set +u
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          set -u
          python -m pip install cmake==4.4.4 ninja==1.13.2
          bash scripts/build-sumo-wasm.sh
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
        env:
          TRAFFIC_TEST_SUMO: '1'
          TRAFFIC_TEST_WASM: '1'
      - uses: actions/upload-artifact@v4
        with:
          name: sumo-wasm
          path: sumo-wasm/
          retention-days: 90
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-playtest-screens
          path: test-results/*.png
