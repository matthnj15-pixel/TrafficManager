<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0f4b70">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg">
  <link rel="stylesheet" href="./styles.css">
  <title>Traffic Manager · School pickup</title>
</head>
<body>
<main class="game">
  <svg id="map" viewBox="0 0 500 700" preserveAspectRatio="xMidYMid meet" aria-label="School pickup road map"></svg>
  <section id="comparison" class="comparison" aria-label="Simulation comparison" hidden>
    <figure class="comparison-panel">
      <figcaption><strong>Original</strong><output id="original-stats"></output></figcaption>
      <svg id="original-map" viewBox="218 135 256 332" aria-label="Original simulation map"></svg>
    </figure>
    <figure class="comparison-panel">
      <figcaption><strong>Your design</strong><output id="design-stats"></output></figcaption>
      <svg id="design-map" viewBox="218 135 256 332" aria-label="Your design simulation map"></svg>
    </figure>
  </section>
  <header>
    <div class="glass title"><span class="scenario">School pickup</span><span id="subtitle">Make room for pickup traffic.</span></div>
    <button id="menu" class="glass round" aria-label="Menu" aria-expanded="false">•••</button>
  </header>
  <div id="menu-panel" class="glass menu-panel" hidden>
    <span id="offline">Preparing offline play…</span>
    <button id="reset" type="button">Restore original design</button>
  </div>
  <aside class="glass tools" aria-label="Road tools">
    <button type="button" data-tool="move" aria-label="Move node"></button>
    <button type="button" data-tool="curve" aria-label="Adjust curve"></button>
    <button type="button" data-tool="lanes" aria-label="Connect lanes"></button>
    <button type="button" data-tool="junction" aria-label="Junctions"></button>
    <button type="button" data-tool="slip" aria-label="Draw slip lane"></button>
    <button type="button" data-tool="signal" aria-label="Signal timing"></button>
  </aside>
  <section id="inspector" class="glass inspector" aria-label="Design controls"></section>
  <nav class="glass tabs" aria-label="Game views">
    <button data-view="design">Design</button><button data-view="simulate">Simulate</button><button data-view="results">Results</button>
  </nav>
</main>
<script type="module" src="./app.mjs"></script>
</body>
</html>
