<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0f4b70">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg">
  <link rel="stylesheet" href="./styles.css">
  <title>Traffic Manager · School Pickup</title>
</head>
<body>
<main class="game">
  <svg id="map" viewBox="0 0 500 700" preserveAspectRatio="xMidYMid meet" aria-label="School pickup road map"></svg>
  <section id="comparison" class="comparison" aria-label="Simulation comparison" hidden>
    <figure class="comparison-panel" data-map-version="original">
      <figcaption><strong>Original</strong><div class="map-stats"><output id="original-stats"></output><output id="original-queue"></output></div></figcaption>
      <svg id="original-map" viewBox="218 135 256 332" aria-label="Original simulation map"></svg>
    </figure>
    <figure class="comparison-panel" data-map-version="design">
      <figcaption><strong>Your design</strong><div class="map-stats"><output id="design-stats"></output><output id="design-queue"></output></div></figcaption>
      <svg id="design-map" viewBox="218 135 256 332" aria-label="Your design simulation map"></svg>
    </figure>
  </section>
  <header>
    <button id="menu" class="glass title" type="button" aria-label="Menu" aria-expanded="false" aria-controls="menu-panel">
      <svg class="scenario-icon" viewBox="0 0 32 32" aria-hidden="true"><path d="M6 26V6m20 0v20M16 7v3m0 5v3m0 5v3"/><path d="M5 26c6-1 12-4 12-10V7m-4 4 4-4 4 4"/></svg>
      <span>Traffic Manager</span>
      <svg class="menu-chevron" viewBox="0 0 16 16" aria-hidden="true"><path d="m4 6 4 4 4-4"/></svg>
    </button>
    <nav class="glass tabs" aria-label="Game views">
      <button data-view="design">Design</button><button data-view="simulate">Simulate</button><button data-view="results">Results</button>
    </nav>
  </header>
  <div id="menu-panel" class="glass menu-panel" hidden>
    <strong>School Pickup</strong>
    <span id="offline">Preparing offline play…</span>
    <span id="subtitle" role="status" hidden></span>
    <button data-action="new-builder" type="button" hidden>Try new Road Builder</button>
    <button id="reset" type="button">Restore original design</button>
  </div>
  <aside class="glass tools" aria-label="Road tools">
    <button type="button" data-tool="road" aria-label="Road Builder"></button>
    <button type="button" data-tool="move" aria-label="Move node"></button>
    <button type="button" data-tool="curve" aria-label="Adjust curve"></button>
    <button type="button" data-tool="lanes" aria-label="Connect lanes"></button>
    <button type="button" data-tool="junction" aria-label="Junctions"></button>
    <button type="button" data-tool="slip" aria-label="Draw slip lane"></button>
    <button type="button" data-tool="signal" aria-label="Signal timing"></button>
  </aside>
  <section id="inspector" class="glass inspector" aria-label="Design controls"></section>
</main>
<script type="module" src="./app.mjs"></script>
</body>
</html>
